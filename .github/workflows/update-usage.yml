# 用量卡由本地 `just sync-usage` 生成并提交 usage/*.svg。
# CI 仅支持手动重渲：若 runner 无 usage/data（默认 gitignore），则跳过成功。
name: Update usage SVGs

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/pi_usage.py"
      - "usage/**"
      - ".github/workflows/update-usage.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Render SVGs
        id: render
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(usage/data/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No usage/data/*.json (ignored or empty) — skip render"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/pi_usage.py render
          test -f usage/pi.svg
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.render.outputs.skipped != 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- usage/*.svg README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update usage svgs [skip ci]"
          git push
