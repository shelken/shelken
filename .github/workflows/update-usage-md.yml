name: Update Pi usage SVG

on:
  workflow_dispatch:
  push:
    paths:
      - '*-cc.json'
      - 'cc.json'
      - 'scripts/pi_usage.py'
      - '.github/workflows/update-usage-md.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render SVG
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./*-cc.json)
          if [[ -f ./cc.json ]]; then
            files+=("./cc.json")
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No usage json found" >&2
            exit 1
          fi
          python3 scripts/pi_usage.py render
          test -f pi-usage.svg

      - name: Commit
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- pi-usage.svg README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update pi usage svg [skip ci]"
          git push
