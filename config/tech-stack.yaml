# ==============================================================================
# Tech Stack Badges Configuration
# ==============================================================================
# Catppuccin Macchiato Palette (可用颜色键名):
#   - pink     (#f5bde6)
#   - mauve    (#c6a0f6)
#   - red      (#ed8796)
#   - peach    (#f5a97f)
#   - yellow   (#eed49f)
#   - green    (#a6da95)
#   - teal     (#8bd5ca)
#   - sky      (#91d7e3)
#   - sapphire (#7dc4e4)
#   - blue     (#8aadf4)
#   - lavender (#b7bdf8)
#   - text     (#cad3f5)
#
# 配置格式说明:
#   groups:
#     - title: 分组标题 (如 "Languages")
#       slug: 输出文件名 (可选，默认根据 title 自动转 kebab-case，如 "languages")
#       items:
#         - name: 显示文字 (空格将自动渲染为 shields badge 间距)
#           color: Catppuccin 颜色键 (必填，参照上方列表)
#           logo: SimpleIcons 标识符 (可选，无图标时不填或填 null)
#         # 也支持紧凑数组简写: [name, color, logo]
#         # - [Rust, peach, rust]
# ==============================================================================

