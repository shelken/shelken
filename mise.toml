[tasks.export-usage]
description = "导出 usage/data（pi+claude+codex+opencode）"
run = "python3 scripts/pi_usage.py export --client all"

[tasks.render-usage]
description = "渲染 usage/*.svg + README"
run = "python3 scripts/pi_usage.py render"

[tasks.sync-usage]
description = "导出 + 渲染全部客户端"
run = "python3 scripts/pi_usage.py sync --client all"

[tasks.preview-readme]
description = "GitHub API 渲染 README 本地预览（非 grip）"
run = "python3 scripts/gh_preview.py --port 6450"
